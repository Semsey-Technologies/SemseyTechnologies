<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Semsey Technologies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/theme/theme.css">
  <style>
    :root {
      /* Theme-ready variables */
      --accent: #2f8bff;
      --fg: #e9f1ff;

      /* Background gradient stops */
      --bg1: #10264f;
      --bg2: #0b1d3d;
      --bg3: #08162f;
      --bg4: #051022;
      --bg5: #030a18;

      /* Logo glow colors */
      --glow1: rgba(47, 139, 255, 0.55);
      --glow2: rgba(56, 189, 248, 0.35);
      --glow3: rgba(56, 189, 248, 0.25);

      --font-main: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* Darker, richer blue gradient */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(circle at center,
          var(--bg1) 0%,
          var(--bg2) 30%,
          var(--bg3) 55%,
          var(--bg4) 75%,
          var(--bg5) 100%);
      color: var(--fg);
      font-family: var(--font-main);
    }

    /* Cogwheel pinned to top-right */
    .settings-button {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(20, 40, 80, 0.85);
      color: #cbd5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.2s ease;
      font-size: 24px;
      z-index: 999;
      text-decoration: none;
    }

    .settings-button:hover {
      background: rgba(30, 60, 120, 1);
      border-color: var(--accent);
      transform: rotate(12deg);
    }

    /* Centered content moved upward */
    .hero {
      width: 100%;
      max-width: 900px;
      padding: 20px;
      margin-top: -180px;
    }

    /* Logo with glow only */
    .logo {
      width: 450px;
      height: 450px;
      margin: 0 auto 6px;

      filter:
        drop-shadow(0 0 60px var(--glow1))
        drop-shadow(0 0 120px var(--glow2))
        drop-shadow(0 0 180px var(--glow3));
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Tagline moved up */
    .tagline {
      font-size: 1.35rem;
      max-width: 650px;
      margin: 0 auto 0px;
      color: var(--fg);
    }

    /* Sub-tagline moved up */
    .subtagline {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c3d0ff;
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: rgba(10, 30, 70, 0.6);
      color: var(--fg);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: rgba(20, 50, 110, 0.9);
      border-color: #60a5ff;
      box-shadow: 0 0 24px rgba(47, 139, 255, 0.25);
      transform: translateY(-2px);
    }

    /* True footer at bottom */
    footer {
      position: fixed;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #b8c4e0;
      pointer-events: none;
    }
  </style>
<script src="assets/theme/theme.js"></script>
</head>

<body>

  <!-- Cogwheel now links to settings page -->
  <a href="settings.html" class="settings-button">⚙️</a>

  <!-- Centered content -->
  <main class="hero">

    <div class="logo">
      <img src="assets/images/logo/logo.jpeg" alt="Semsey Technologies Logo" />
    </div>

    <div class="tagline">
      I build systems, theories, and tools — and I release them freely.
    </div>

    <div class="subtagline">
      Open‑source · Non‑restrictive · Pay‑what‑you‑want
    </div>

    <div class="buttons">
      <a href="#about" class="btn">About</a>
      <a href="#projects" class="btn">Projects</a>
    </div>

  </main>

  <!-- True footer -->
  <footer>
    © 2026 Semsey Technologies
  </footer>

</body>
</html>
